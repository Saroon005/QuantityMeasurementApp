<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantity Measurement</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Welcome To Quantity Measurement</h1>
</header>

<div class="container">

    <h3 class="section-title">CHOOSE TYPE</h3>

    <div class="type-grid">

        <div class="type-card active">
            <div class="icon">📏</div>
            <p>Length</p>
        </div>

        <div class="type-card">
            <div class="icon">⚖️</div>
            <p>Weight</p>
        </div>

        <div class="type-card">
            <div class="icon">🌡️</div>
            <p>Temperature</p>
        </div>

        <div class="type-card">
            <div class="icon">🧪</div>
            <p>Volume</p>
        </div>

    </div>

    <h3 class="section-title">CHOOSE ACTION</h3>

    <div class="action-buttons">
        <button class="primary">Comparison</button>
        <button>Conversion</button>
        <button>Arithmetic</button>
    </div>


    <div class="conversion-section">

        <div class="input-box">

            <label>FROM</label>

            <div class="value">1</div>

            <select>
                <option>Kilometer</option>
            </select>

        </div>

        <div class="input-box">

            <label>TO</label>

            <div class="value">1000</div>

            <select>
                <option>Meters</option>
            </select>

        </div>

    </div>

</div>


<div class="container">

    <div class="arithmetic-section">

        <div class="input-box">

            <label>VALUE 1</label>

            <div class="value">1</div>

            <select>
                <option>Kilogram</option>
            </select>

        </div>

        <div class="operator">+</div>

        <div class="input-box">

            <label>VALUE 2</label>

            <div class="value">1</div>

            <select>
                <option>Gram</option>
            </select>

        </div>

    </div>


    <div class="result-box">

        <div>
            <p class="result-label">RESULT</p>
            <h2>1.001</h2>
        </div>

        <select>
            <option>Kilogram</option>
        </select>

    </div>

</div>

</body>
</html>
